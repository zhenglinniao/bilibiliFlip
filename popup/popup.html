<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>视频转转</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div class="mark" aria-hidden="true">↻</div>
        <div>
          <h1>视频转转</h1>
          <p id="status">正在寻找视频…</p>
        </div>
      </header>

      <section aria-labelledby="angle-title">
        <div class="section-heading">
          <h2 id="angle-title">选择方向</h2>
          <output id="angle-output">0°</output>
        </div>
        <div class="angle-grid" role="group" aria-label="视频旋转角度">
          <button type="button" data-angle="0">0°</button>
          <button type="button" data-angle="90">90°</button>
          <button type="button" data-angle="180">180°</button>
          <button type="button" data-angle="270">270°</button>
        </div>
      </section>

      <div class="turn-row" role="group" aria-label="逐次旋转">
        <button type="button" class="secondary" data-direction="counterclockwise">↶ 逆时针</button>
        <button type="button" class="secondary" data-direction="clockwise">顺时针 ↷</button>
      </div>

      <label class="remember-row">
        <span>
          <strong>记住上次角度</strong>
          <small>刷新或打开新视频时自动恢复</small>
        </span>
        <input id="remember" type="checkbox">
        <span class="switch" aria-hidden="true"></span>
      </label>

      <footer>快捷键：Alt + Shift + R 顺时针旋转</footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
